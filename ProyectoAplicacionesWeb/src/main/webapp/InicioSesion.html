<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Iniciar Sesión</title>

<style>
    .background-blur {
        position: fixed; 
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        
        background-image: url('https://img.freepik.com/foto-gratis/textura-grunge-oscuro_1048-4055.jpg?semt=ais_hybrid&w=740&q=80');
        background-size: cover;
        background-position: center;
        
        filter: blur(5px);
        
        z-index: -1; 
    }

    body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: #333; 
    }

    .login-container {
        background-color: rgba(0, 0, 0, 0.8); 
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.4); 
        width: 300px;
        color: white; 
        position: relative; 
        padding-top: 4rem; 
    }
    
    .login-container h1 { text-align: center; margin-top: 0; color: #eee; }

    .form-group {
        margin-bottom: 1.5rem; 
    }

    .form-group label { display: block; margin-bottom: 5px; color: #bbb; }

    .form-group input {
        width: 100%;
        padding: 10px;
        /* Un estudiante casi siempre olvida el 'box-sizing: border-box;' */
        border: none; 
        border-bottom: 1px solid #555; 
        background-color: transparent; 
        color: white; 
        border-radius: 0; 
    }
    .form-group input::placeholder {
        color: #888; 
    }

    .btn {
        width: 100%;
        padding: 12px;
        background-color: #e50914; 
        color: white;
        border: none ; /* Espacio raro, muy humano */
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;

        margin-top: 1.5rem; 
    }

    .btn:hover {
        background-color: #b80710; 
    }
    .links-adicionales {
        text-align: center;
        margin-top: 1rem;
        font-size: 0.9em;
    }
    .links-adicionales a {
        color: #007bff; 
        text-decoration: none;
        display: block; 
        margin-top: 5px;
    }
    .links-adicionales a:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>

    <div class="background-blur"></div>

    <div class="login-container">
        
        <h1>Iniciar Sesión</h1>
        
        <form action="ControladorTienda" method="POST">
        
        <input type="hidden" name="accion" value="validarLogin">

            <div class="form-group">
                <label for="email">Usuario</label>
                <input type="text" id="email" name="txtEmail" placeholder="Ingresa un usuario" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="txtPassword" placeholder="Ingresa una contraseña" required>
            </div>
            
            <button type="submit" class="btn">Entrar</button>
            
        </form>

        <div class="links-adicionales">
            <a href="#">¿Olvidaste tu contraseña?</a>
            <a href="#">¿Aún no tienes una cuenta?</a>
        </div>
    </div>

</body>
</html>
